---
name: Deploy
on:
  push:
    branches:
      - main
    tags:
      - '*'
permissions:
  id-token: write
  contents: read

jobs:    
  format:
    name: Terragrunt format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Format
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/accounts
          tg_command: hcl fmt --check --diff

  validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Validate
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tf_version: 1.13.5
          tg_version: 0.59.6
          tg_dir: infra/accounts/dev/hello-world
          tg_command: validate

  plan:
    needs:
      - format
      - validate
      - publish-docker-image
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Generate Release version
        id: release_version
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          RELEASE_VERSION=${GIT_SHA::7}
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/accounts/dev/hello-world
          tg_command: plan -var release_version=${{ steps.release_version.outputs.release_version }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/accounts/dev/hello-world
          tg_command: apply -var release_version=${{ needs.plan.outputs.release_version }} -auto-approve
