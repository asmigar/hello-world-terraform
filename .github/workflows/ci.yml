---
name: Deploy
on:
  push:
    branches:
      - main
    tags:
      - '*'
permissions:
  id-token: write
  contents: read

jobs:    
  format-hcl:
    name: HCL format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Format
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra
          tg_command: hcl fmt --check --diff

  format:
    name: Opentofu format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Format
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/modules
          tg_command: run --no-auto-init --config=no-op.hcl -- fmt -check -diff -recursive

  validate-hcl:
    name: HCL validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Validate
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra
          tg_command: hcl validate --inputs

  validate:
    name: Opentofu validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Validate
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/dev
          tg_command: validate

  plan:
    needs:
      - format
      - validate
      - validate-hcl
      - format-hcl
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Plan
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/dev
          tg_command: plan

  apply:
    needs: plan
    runs-on: ubuntu-26.04-arm
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHubAction
      - name: Apply
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: infra/dev
          tg_command: apply
